<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>体重ペース 管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="top">
    <h1>管理</h1>
    <div class="links"><a href="./">自分の記録</a></div>
  </div>
  <p class="sub" id="sub">使っている人の一覧</p>
  <div class="msg" id="msg" role="status"></div>

  <!-- 一覧 -->
  <section id="view-list" hidden>
    <div class="stats" id="summary"></div>
    <section class="card">
      <h2>使っている人（最後に記録した日が新しい順）</h2>
      <div id="members"></div>
    </section>
  </section>

  <!-- 1人の詳しい画面 -->
  <section id="view-one" hidden>
    <button class="back" type="button" id="back">一覧にもどる</button>
    <h2 id="one-name" style="font-size:22px;margin:8px 4px 2px"></h2>
    <p class="sub" id="one-meta"></p>
    <section class="stats" id="one-stats"></section>
    <section class="card">
      <h2>週の平均の推移</h2>
      <div class="chart-wrap">
        <svg id="chart" role="img" aria-label="週ごとの平均体重のグラフ"></svg>
        <div class="tip" id="tip"></div>
      </div>
      <div class="legend" id="legend">
        <span><i class="sw-line"></i>週の平均</span>
        <span><i class="sw-dash"></i>このペースの予測</span>
        <span><i class="sw-dot"></i>毎日の記録</span>
      </div>
    </section>
    <section class="card">
      <h2>目標ペース</h2>
      <div class="goal-out" id="one-goal" style="margin-top:0;border-top:0;padding-top:0"></div>
    </section>
    <section class="card">
      <h2>週ごとの平均</h2>
      <div id="one-weeks"></div>
    </section>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="shared.js"></script>
<script>
(async () => {
  const { ymd, parse, md, fmt, signed, cls, esc, weeks, forecast, renderStats, createChart, renderWeeks, goalHtml, DAY } = WP;
  const sb = supabase.createClient(WP_CONFIG.url, WP_CONFIG.key, { auth: { persistSession: true, autoRefreshToken: true } });
  const $ = id => document.getElementById(id);
  const today = ymd(new Date());
  const msg = (t, bad) => { $('msg').textContent = t || ''; $('msg').style.color = bad ? 'var(--up)' : 'var(--text-3)'; };
  const chart = createChart({ svg: $('chart'), tip: $('tip'), legend: $('legend') });

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.href = './'; return; }
  const me = session.user;
  const p = await sb.from('profiles').select('is_admin').eq('id', me.id).maybeSingle();
  if (!p.data?.is_admin) { msg('この画面は管理者だけが見られます。', true); return; }

  // 全員分をまとめて読む（RLSで管理者だけ全件が返る）
  msg('読み込み中…');
  const [pr, wr, gr] = await Promise.all([
    sb.from('profiles').select('id,email,display_name,created_at'),
    sb.from('weights').select('user_id,day,kg,source').order('day').limit(100000),
    sb.from('goals').select('*'),
  ]);
  if (pr.error || wr.error || gr.error) { msg('読み込めませんでした: ' + (pr.error || wr.error || gr.error).message, true); return; }
  msg('');

  const byUser = new Map();
  pr.data.forEach(u => byUser.set(u.id, { ...u, data: {}, goal: {} }));
  wr.data.forEach(r => { const u = byUser.get(r.user_id); if (u) u.data[r.day] = Number(r.kg); });
  gr.data.forEach(g => { const u = byUser.get(g.user_id); if (u) u.goal = g; });

  const people = [...byUser.values()].map(u => {
    const keys = Object.keys(u.data).sort();
    const ws = weeks(u.data);
    return { ...u, last: keys[keys.length - 1] || null, days: keys.length, ws, fc: forecast(ws) };
  }).sort((a, b) => (b.last || '').localeCompare(a.last || ''));

  const nameOf = u => u.display_name || u.email || '名前なし';
  const daysAgo = d => d ? Math.round((parse(today) - parse(d)) / DAY) : null;

  function renderList() {
    $('view-one').hidden = true; $('view-list').hidden = false;
    const active = people.filter(u => daysAgo(u.last) != null && daysAgo(u.last) <= 3).length;
    $('summary').innerHTML = `
      <div class="stat"><div class="label">登録している人</div><div class="value">${people.length}<small>人</small></div></div>
      <div class="stat"><div class="label">3日以内に記録</div><div class="value">${active}<small>人</small></div></div>`;
    if (!people.length) { $('members').innerHTML = '<div class="empty">まだ誰も登録していません</div>'; return; }
    $('members').innerHTML = people.map(u => {
      const ago = daysAgo(u.last);
      const cur = u.ws[u.ws.length - 1];
      const lastTxt = ago == null ? '記録なし' : ago === 0 ? '今日記録' : `${ago}日前に記録`;
      return `<div class="member" data-id="${esc(u.id)}" role="button" tabindex="0">
        <div class="name">${esc(nameOf(u))}</div>
        <div class="val">${cur ? fmt(cur.avg) + ' kg' : '—'}</div>
        <div class="meta ${ago != null && ago > 3 ? 'stale' : ''}">${lastTxt}・${u.days}日分</div>
        <div class="pace ${u.fc ? cls(u.fc.perMonth) : ''}">${u.fc ? signed(u.fc.perMonth) + 'kg/月' : 'ペース未算出'}</div>
      </div>`;
    }).join('');
  }
  function renderOne(id) {
    const u = people.find(x => x.id === id);
    if (!u) return renderList();
    $('view-list').hidden = true; $('view-one').hidden = false;
    $('one-name').textContent = nameOf(u);
    $('one-meta').textContent = `${u.email || ''}　登録 ${md(new Date(u.created_at))}　記録 ${u.days}日分`;
    renderStats($('one-stats'), u.ws, u.fc);
    chart.draw(u.data, u.ws, u.fc);
    $('one-goal').innerHTML = goalHtml(u.goal || {}, u.data, u.ws, u.fc, today);
    renderWeeks($('one-weeks'), u.ws);
    scrollTo(0, 0);
  }
  $('members').addEventListener('click', e => { const m = e.target.closest('.member'); if (m) renderOne(m.dataset.id); });
  $('members').addEventListener('keydown', e => { const m = e.target.closest('.member'); if (m && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); renderOne(m.dataset.id); } });
  $('back').addEventListener('click', renderList);
  renderList();
})();
</script>
</body>
</html>
